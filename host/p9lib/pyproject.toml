[project]
name = "p9lib"
version = "0.1.0"
description = "A real, general-purpose 9P2000 client and file utility for LugalOS's filesystem server"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
lugal9p = "p9lib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p9lib"]
