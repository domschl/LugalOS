[project]
name = "fuse-p9"
version = "0.1.0"
description = "FUSE filesystem exposing LugalOS's entire 9P namespace to a host directory (Linux; macOS/macFUSE later)"
requires-python = ">=3.11"
dependencies = [
    "fusepy>=3.0.1",
    "p9lib[serial]",
]

[project.scripts]
lugal9pfuse = "fuse_p9.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuse_p9"]

[tool.uv.sources]
p9lib = { path = "../p9lib" }
