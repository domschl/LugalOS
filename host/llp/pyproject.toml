[project]
name = "llp"
version = "0.1.0"
description = "Reference implementation of LLP, the LugalOS link protocol (doc/dev/protocols/llp.md)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
p9 = ["p9lib"]                 # 9P over LLP (`llp host --cat`)

[project.scripts]
llp = "llp.cli:main"
llp-vectors = "llp.vectors:main"

[tool.uv.sources]
p9lib = { path = "../p9lib", editable = true }

[dependency-groups]
dev = ["pytest>=8", "types-pyserial"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llp"]

[tool.pyrefly]
project-includes = ["src", "tests"]
