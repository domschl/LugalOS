[project]
name = "llp"
version = "0.1.0"
description = "Reference implementation of LLP, the LugalOS link protocol (doc/llp.md)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
llp = "llp.cli:main"
llp-vectors = "llp.vectors:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llp"]

[tool.pyrefly]
project-includes = ["src", "tests"]
